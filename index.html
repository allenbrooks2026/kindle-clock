<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock For Kindle</title>
  <style>
    @font-face {
      font-family: TIME;
      src: url("clock-font.ttf") format("truetype");
    }

    * {
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      text-align: center;
      /* Shift up 10% of the viewport height, same as before -- done as a
         plain layout margin so it applies before rotation, regardless of
         rotation angle. Centering itself is handled by the flex container
         above rather than the old position:absolute + percentage-translate
         trick, which is fragile on Kindle's old WebKit build. */
      margin-top: -10vh;
      transform-origin: center center;
    }

    .time {
      font-family: TIME, "Courier New", monospace;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 1rem 0;
    }

    .date {
      white-space: nowrap;
    }

    .cn-date {}
  </style>
</head>

<body>
  <div class="app">
    <div class="date"></div>
    <div class="time"></div>
    <div class="cn-date"></div>
  </div>

  <script src="./calendar.min.js"></script>
  <script src="./index.js"></script>
</body>

</html>
