<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kindle Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
    color: #000;
  }
  #stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    text-align: center;
    transform-origin: center center;
  }
  #time {
    font-family: "Courier New", Consolas, monospace;
    font-weight: bold;
    font-size: 22vw;
    line-height: 1;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  #colon {
    display: inline-block;
  }
  #colon.dim {
    opacity: 0.15;
  }
  #date {
    font-family: "Courier New", Consolas, monospace;
    font-weight: bold;
    font-size: 4.5vw;
    letter-spacing: 0.15em;
    margin-top: 2vh;
    white-space: nowrap;
  }
  body.dark {
    background: #000;
    color: #fff;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <div id="time">--<span id="colon">:</span>--</div>
    <div id="date">----</div>
  </div>
</div>

<script>
(function () {
  function param(name, fallback) {
    var m = new RegExp("[?&]" + name + "=([^&]+)").exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : fallback;
  }

  var format = param("format", "24");   // "24" or "12"
  var theme = param("theme", "light");  // "light" or "dark"
  var rotate = param("r", "0");         // degrees: 0, 90, 180, 270
  var fs = param("fs", "");             // override time font-size, e.g. "18vw" or "220px"
  var dfs = param("dfs", "");           // override date font-size
  var showDate = param("date", "1") !== "0";
  var lang = param("lang", "en");       // "en" or "iso"

  if (theme === "dark") {
    document.body.className = "dark";
  }

  var wrap = document.getElementById("wrap");
  if (rotate !== "0") {
    wrap.style.transform = "rotate(" + rotate + "deg)";
  }

  var timeEl = document.getElementById("time");
  var dateEl = document.getElementById("date");
  var colonEl = document.getElementById("colon");

  if (fs) timeEl.style.fontSize = fs;
  if (dfs) dateEl.style.fontSize = dfs;
  if (!showDate) dateEl.style.display = "none";

  var DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function pad2(n) {
    n = n < 10 ? "0" + n : "" + n;
    return n;
  }

  function render() {
    var now = new Date();
    var hours = now.getHours();
    var minutes = now.getMinutes();
    var suffix = "";

    if (format === "12") {
      suffix = hours >= 12 ? " PM" : " AM";
      hours = hours % 12;
      if (hours === 0) hours = 12;
    }

    timeEl.childNodes[0].nodeValue = pad2(hours);
    timeEl.childNodes[2].nodeValue = pad2(minutes) + suffix;

    colonEl.className = (now.getSeconds() % 2 === 0) ? "" : "dim";

    if (showDate) {
      var dateStr;
      if (lang === "iso") {
        dateStr = now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
      } else {
        dateStr = DAY_NAMES[now.getDay()] + "  " + MONTH_NAMES[now.getMonth()] + " " + now.getDate() + ", " + now.getFullYear();
      }
      dateEl.firstChild.nodeValue = dateStr;
    }
  }

  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
