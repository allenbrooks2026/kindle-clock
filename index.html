<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kindle Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
    color: #000;
  }
  #stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: center center;
  }
  #hour, #minute {
    font-family: "Courier New", Consolas, monospace;
    font-weight: bold;
    font-size: 13vw;
    line-height: 0.95;
  }
  #colon {
    font-family: "Courier New", Consolas, monospace;
    font-weight: bold;
    font-size: 5vw;
    line-height: 0.5;
    margin: 0.5vh 0;
  }
  #ampm {
    font-family: "Courier New", Consolas, monospace;
    font-weight: bold;
    font-size: 5vw;
    letter-spacing: 0.2em;
    margin-top: 1vh;
  }
  #date {
    font-family: "Courier New", Consolas, monospace;
    font-weight: bold;
    font-size: 2.7vw;
    letter-spacing: 0.15em;
    margin-top: 2vh;
    white-space: nowrap;
  }
  body.dark {
    background: #000;
    color: #fff;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <div id="hour">--</div>
    <div id="colon">:</div>
    <div id="minute">--</div>
    <div id="ampm">--</div>
    <div id="date">----</div>
  </div>
</div>

<script>
(function () {
  function param(name, fallback) {
    var m = new RegExp("[?&]" + name + "=([^&]+)").exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : fallback;
  }

  var format = param("format", "12");   // "12" or "24"
  var theme = param("theme", "light");  // "light" or "dark"
  var rotate = param("r", "0");         // degrees: 0, 90, 180, 270
  var fs = param("fs", "");             // override hour/minute font-size, e.g. "16vw"
  var dfs = param("dfs", "");           // override date font-size
  var showDate = param("date", "1") !== "0";
  var lang = param("lang", "en");       // "en" or "iso"

  if (theme === "dark") {
    document.body.className = "dark";
  }

  var wrap = document.getElementById("wrap");
  if (rotate !== "0") {
    wrap.style.transform = "rotate(" + rotate + "deg)";
  }

  var hourEl = document.getElementById("hour");
  var minuteEl = document.getElementById("minute");
  var ampmEl = document.getElementById("ampm");
  var dateEl = document.getElementById("date");

  if (fs) {
    hourEl.style.fontSize = fs;
    minuteEl.style.fontSize = fs;
  }
  if (dfs) dateEl.style.fontSize = dfs;
  if (!showDate) dateEl.style.display = "none";
  if (format !== "12") ampmEl.style.display = "none";

  var DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function pad2(n) {
    return n < 10 ? "0" + n : "" + n;
  }

  function render() {
    var now = new Date();
    var hours = now.getHours();
    var minutes = now.getMinutes();

    if (format === "12") {
      ampmEl.textContent = hours >= 12 ? "PM" : "AM";
      hours = hours % 12;
      if (hours === 0) hours = 12;
      hourEl.textContent = "" + hours;
    } else {
      hourEl.textContent = pad2(hours);
    }

    minuteEl.textContent = pad2(minutes);

    if (showDate) {
      var dateStr;
      if (lang === "iso") {
        dateStr = now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
      } else {
        dateStr = DAY_NAMES[now.getDay()] + "  " + MONTH_NAMES[now.getMonth()] + " " + now.getDate() + ", " + now.getFullYear();
      }
      dateEl.textContent = dateStr;
    }
  }

  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
